# Local dependencies for development.
#
#   docker compose up -d
#   cd backend && DATABASE_URL=postgresql+psycopg://carbon:carbon@localhost:5432/carbon \
#     RATELIMIT_STORAGE_URI=redis://localhost:6379/0 python app.py
#
# Redis is not optional for more than one worker. Flask-Limiter's memory://
# store counts per process, so a 10/minute login limit becomes 40 with four
# workers and no error is raised anywhere. Config.validate() refuses to start in
# production when WEB_CONCURRENCY is above 1 with memory:// selected.
#
# Point RATELIMIT_STORAGE_URI at 127.0.0.1, NOT localhost. On most machines
# localhost resolves to ::1 first, Docker publishes only the IPv4 port, and the
# client then waits out the connect timeout before falling back -- measured here
# as a 21 second penalty on the first request. Same trap as `vite preview`.
#
#   RATELIMIT_STORAGE_URI=redis://127.0.0.1:6379/0
#
# Host ports come from the environment with development-friendly defaults,
# because both 5432 and 6379 are commonly already taken by something else on a
# developer machine -- and a hard port clash stops the whole stack from starting
# for a reason that has nothing to do with this project.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: carbon
      POSTGRES_PASSWORD: carbon
      POSTGRES_DB: carbon
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The migrate step waits on this, so a cold container does not produce a
      # confusing "database does not exist" on first run.
      test: ["CMD-SHELL", "pg_isready -U carbon"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Rate-limit counters are scratch state. Persisting them across a restart
    # would let a rate-limited client serve out the clock by waiting for a
    # deploy, which is the opposite of what a limiter is for.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
