name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a previous run when the same branch is pushed again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (sqlite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Reuse the pip cache; the suite installs the same pins every run.
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Check migrations are up to date with the models
        # A model edited without a matching revision fails at runtime on an
        # existing database, which is exactly the failure this prevents.
        # `flask db check` autogenerates and reports pending operations.
        run: |
          export FLASK_APP=app.py
          export DATABASE_URL=sqlite:///ci_check.db
          export AUTO_CREATE_TABLES=false
          flask db upgrade
          flask db check

      - name: Tests
        run: pytest tests -q

  backend-postgres:
    name: Backend (postgres)
    runs-on: ubuntu-latest

    # The sqlite job proves the schema applies to an empty file. This one proves
    # it also applies to Postgres, which is what production will actually use,
    # and that the queries work there rather than only on SQLite.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: carbon
          POSTGRES_PASSWORD: carbon
          POSTGRES_DB: carbon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U carbon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "psycopg[binary]==3.2.9"

      - name: Migrations apply to Postgres
        run: |
          export FLASK_APP=app.py
          export DATABASE_URL="postgresql+psycopg://carbon:carbon@localhost:5432/carbon_test"
          export AUTO_CREATE_TABLES=false
          flask db upgrade
          flask db check

      - name: Tests against Postgres
        run: pytest tests -q
        env:
          DATABASE_URL: postgresql+psycopg://carbon:carbon@localhost:5432/carbon_test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build